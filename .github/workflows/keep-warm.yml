name: SpacePixel Monitor (5-Min Loop 1-Min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keep-warm.yml'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Loop & Report Every 1 Min (via curl)
        run: |
          BASE="https://sp-api-lime.vercel.app/api"
          ENDPOINTS="health thrusters shields tanks planets"
          
          for i in {1..5}; do
            REPORT=""
            ALL_OK=true
            
            for ep in $ENDPOINTS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" $BASE/$ep)
              ICON=$([ $STATUS -eq 200 ] && echo "🟢" || echo "🔴")
              REPORT="${REPORT}${ICON} /api/$ep → $STATUS\\n"
              [ $STATUS -ne 200 ] && ALL_OK=false
            done
            
            curl -s -X POST ${{ secrets.DISCORD_WEBHOOK }} \
              -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"📊 SpacePixel Report [${i}/5]\",
                  \"description\": \"**Jam:** $(date -u +'%H:%M UTC')\\n${REPORT}\",
                  \"color\": $([ "$ALL_OK" = true ] && echo "65280" || echo "16711680"),
                  \"footer\": {\"text\": \"Loop ${i}/5 | Vercel + GitHub Actions\"}
                }]
              }"
            
            [ $i -lt 5 ] && sleep 60
          done
