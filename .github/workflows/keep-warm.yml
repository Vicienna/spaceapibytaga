name: SpacePixel Monitor - Tiap 5 Menit dengan Loop 1-Min

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Loop Ping Setiap 1 Menit Selama 5 Menit
        run: |
          BASE="https://sp-api-lime.vercel.app/api"
          ENDPOINTS="health thrusters shields tanks planets"
          
          for i in {1..5}; do
            echo "========== Menit ke-$i =========="
            REPORT=""
            ALL_OK=true
            
            for ep in $ENDPOINTS; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" $BASE/$ep)
              ICON=$([ $STATUS -eq 200 ] && echo "🟢" || echo "🔴")
              REPORT="${REPORT}${ICON} /api/$ep → $STATUS\n"
              [ $STATUS -ne 200 ] && ALL_OK=false
            done
            
            # Kirim ke Discord tiap iterasi
            curl -s -X POST ${{ secrets.DISCORD_WEBHOOK }} \
              -H "Content-Type: application/json" \
              -d @- <<EOF
            {
              "embeds": [{
                "title": "📊 SpacePixel Report (Menit $i/5)",
                "description": "**Jam:** $(date -u +"%H:%M UTC")\n$REPORT",
                "color": $([ "$ALL_OK" = true ] && echo "65280" || echo "16711680"),
                "footer": {"text": "Loop: $i/5 - Next in 1 min"}
              }]
            }
            EOF
            
            # Tunggu 60 detik kecuali iterasi terakhir
            [ $i -lt 5 ] && sleep 60
          done
